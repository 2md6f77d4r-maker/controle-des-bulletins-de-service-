name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'app.py'
      - 'excel_patch.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Add Excel support to application
        shell: powershell
        run: |
          python excel_patch.py
          python -m py_compile app.py

      - name: Install Tesseract OCR
        shell: powershell
        run: |
          choco install tesseract --yes --no-progress
          $src = 'C:\Program Files\Tesseract-OCR'
          if (-not (Test-Path $src)) { throw 'Tesseract installation not found' }
          New-Item -ItemType Directory -Force -Path '.\tesseract' | Out-Null
          Copy-Item "$src\tesseract.exe" '.\tesseract\tesseract.exe' -Force
          if (Test-Path "$src\tessdata") {
            Copy-Item "$src\tessdata" '.\tesseract\tessdata' -Recurse -Force
          }
          Get-ChildItem $src -Filter '*.dll' | ForEach-Object { Copy-Item $_.FullName '.\tesseract\' -Force }

      - name: Build executable
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name Controle_BS_RDCN `
            --add-data "tesseract;tesseract" `
            --hidden-import PIL._tkinter_finder `
            app.py

      - name: Package application
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path '.\package' | Out-Null
          Copy-Item '.\dist\Controle_BS_RDCN.exe' '.\package\Controle_BS_RDCN.exe' -Force
          $lines = @(
            'Contrôle BS - RDCN v1.1.0',
            '',
            'Application Windows autonome pour analyser les Bulletins de Service PDF/ZIP et les fichiers Excel.',
            '1 PDF attendu = 1 BS de 3 pages.',
            'Lecture du temps en tête de train, des heures de nuit 22h00-07h00 et du travail effectif.',
            'Import Excel possible seul ou avec les BS.',
            'Quand Excel et BS correspondent au même agent/date, les données sont comparées sans double comptage.',
            'Tout écart entre Excel et BS est signalé pour contrôle.'
          )
          Set-Content '.\package\LISEZ-MOI.txt' -Value $lines -Encoding UTF8
          Compress-Archive -Path '.\package\*' -DestinationPath '.\Controle_BS_RDCN_Windows_v1.1.0.zip' -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Controle_BS_RDCN_Windows_v1.1.0
          path: Controle_BS_RDCN_Windows_v1.1.0.zip
          if-no-files-found: error
          retention-days: 30
